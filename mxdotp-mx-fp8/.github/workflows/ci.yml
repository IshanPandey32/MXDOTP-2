name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Algorithm model vs exact reference
        run: python3 scripts/rtl_model.py
      - name: RTL simulation (Icarus Verilog)
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          ./sim/run_iverilog.sh
      - name: Numerical study
        run: python3 scripts/accuracy_study.py
